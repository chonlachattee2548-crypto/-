name: เผยแพร่เว็บบน GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ดาวน์โหลดไฟล์โครงการ
        uses: actions/checkout@v4
      - name: สร้างค่าตั้งค่าเว็บไซต์จาก Secret
        env:
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          BUILD_VERSION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const config = {
            apiBase: "https://jewelry-gemstone-control.chonlachat-tee2548.workers.dev",
            turnstileSiteKey: process.env.TURNSTILE_SITE_KEY || ""
          };
          writeFileSync(
            "device-config.js",
            `"use strict";\n\nwindow.GEMSTONE_DEVICE_CONFIG = Object.freeze(${JSON.stringify(config, null, 2)});\n`
          );
          const index = readFileSync("index.html", "utf8").replace(
            /(href|src)="(styles\.css|device-config\.js|app\.js)"/g,
            `$1="$2?v=${process.env.BUILD_VERSION}"`
          );
          writeFileSync("index.html", index);
          NODE
      - name: ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5
      - name: เตรียมไฟล์เว็บไซต์
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: เผยแพร่เว็บไซต์
        id: deployment
        uses: actions/deploy-pages@v4
