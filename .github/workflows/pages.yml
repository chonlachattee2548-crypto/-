name: เผยแพร่เว็บบน GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: ดาวน์โหลดไฟล์โครงการ
        uses: actions/checkout@v4
      - name: ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5
      - name: เตรียมไฟล์เว็บไซต์
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: เผยแพร่เว็บไซต์
        id: deployment
        uses: actions/deploy-pages@v4
