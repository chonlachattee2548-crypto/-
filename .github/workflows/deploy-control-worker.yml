name: เผยแพร่บริการกลาง Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-control-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ดาวน์โหลดไฟล์โครงการ
        uses: actions/checkout@v4
      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: เผยแพร่ Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
